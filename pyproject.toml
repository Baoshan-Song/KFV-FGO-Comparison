[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfv-fgo-comparison"
version = "0.4.0"
description = "Python port of the KFV/FGO comparison toolbox"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
colab = ["ipython>=7.34", "ipywidgets>=8,<9"]
real = ["pyrtklib==0.2.7"]
plots = ["matplotlib>=3.8"]

[tool.setuptools]
py-modules = ["experiment_common", "real_experiment", "colab_comparison", "colab_ui", "live_comparison", "run_cache", "schur_window_benchmark"]

[tool.setuptools.packages.find]
include = ["kfv_fgo*", "core*", "config*", "data*"]

[tool.setuptools.package-data]
kfv_fgo = ["comparison.html", "precomputed/*.json.gz", "precomputed/*.json", "config/*.json", "data/*.mat", "data/urban_nav_deep/*", "data/urban_nav_medium/*", "data/urban_nav_harsh/*", "LICENSE", "THIRD_PARTY_NOTICES.md"]
