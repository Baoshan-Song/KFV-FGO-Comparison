[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfv-fgo-comparison"
version = "0.2.0"
description = "Python port of the KFV/FGO comparison toolbox"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
colab = ["ipython>=8", "notebook>=7"]
plots = ["matplotlib>=3.8"]

[tool.setuptools]
py-modules = ["experiment_common", "schur_window_benchmark"]

[tool.setuptools.packages.find]
include = ["kfv_fgo*", "core*", "config*", "data*"]

[tool.setuptools.package-data]
kfv_fgo = ["comparison.html"]
