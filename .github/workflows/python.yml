name: Python verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[real,colab]' pytest nbformat
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest kfv_fgo/tests -q
      - run: python scripts/validate_paper.py --output artifacts/validation.json
      - run: python scripts/check_notebook.py
